<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hourglass Importer</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="header">
    <div class="header__content">
      <div>
        <h1 class="header__title" data-i18n="app.title">Hourglass Importer</h1>
        <div class="header__subtitle" id="subtitle"></div>
      </div>
      <div class="header__right">
        <div id="month-picker"></div>
        <label class="language">
          <span class="visually-hidden" data-i18n="header.language">Language</span>
          <select id="language-select" class="input input--compact input--auto" data-i18n-aria="header.language"></select>
        </label>
        <span id="session-badge" class="badge" data-i18n="session.checking">Checking session…</span>
      </div>
    </div>
    <nav class="header__content tabs" role="tablist" data-i18n-aria="header.steps">
      <button class="tab" role="tab" id="tab-session" data-tab="session" aria-controls="panel-session" aria-selected="true" data-i18n="tab.session">1. Session</button>
      <button class="tab" role="tab" id="tab-import" data-tab="import" aria-controls="panel-import" tabindex="-1" data-i18n="tab.import">2. Import spreadsheet</button>
      <button class="tab" role="tab" id="tab-review" data-tab="review" aria-controls="panel-review" tabindex="-1" data-i18n="tab.review">3. Review and send</button>
      <button class="tab" role="tab" id="tab-missing" data-tab="missing" aria-controls="panel-missing" tabindex="-1" data-i18n="tab.missing">4. Missing reports</button>
    </nav>
  </header>

  <main class="main">
    <section class="panel" id="panel-session" role="tabpanel" aria-labelledby="tab-session"></section>
    <section class="panel" id="panel-import" role="tabpanel" aria-labelledby="tab-import" hidden></section>
    <section class="panel" id="panel-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
    <section class="panel" id="panel-missing" role="tabpanel" aria-labelledby="tab-missing" hidden></section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
