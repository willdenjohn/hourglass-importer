<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importador Hourglass</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topo">
    <div class="topo__conteudo">
      <div>
        <h1 class="topo__titulo">Importador de Relatórios</h1>
        <div class="topo__subtitulo" id="subtitulo">Microsoft Forms → Hourglass</div>
      </div>
      <div class="topo__direita">
        <div id="seletor-mes"></div>
        <span id="selo-sessao" class="selo">Verificando sessão…</span>
      </div>
    </div>
    <nav class="topo__conteudo abas" role="tablist" aria-label="Etapas">
      <button class="aba" role="tab" id="aba-sessao" data-aba="sessao" aria-controls="painel-sessao" aria-selected="true">1. Sessão</button>
      <button class="aba" role="tab" id="aba-importar" data-aba="importar" aria-controls="painel-importar" tabindex="-1">2. Importar planilha</button>
      <button class="aba" role="tab" id="aba-conferencia" data-aba="conferencia" aria-controls="painel-conferencia" tabindex="-1">3. Conferência e envio</button>
      <button class="aba" role="tab" id="aba-faltantes" data-aba="faltantes" aria-controls="painel-faltantes" tabindex="-1">4. Faltantes</button>
    </nav>
  </header>

  <main class="principal">
    <section class="painel" id="painel-sessao" role="tabpanel" aria-labelledby="aba-sessao"></section>
    <section class="painel" id="painel-importar" role="tabpanel" aria-labelledby="aba-importar" hidden></section>
    <section class="painel" id="painel-conferencia" role="tabpanel" aria-labelledby="aba-conferencia" hidden></section>
    <section class="painel" id="painel-faltantes" role="tabpanel" aria-labelledby="aba-faltantes" hidden></section>
  </main>

  <div class="notificacoes" id="notificacoes" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
