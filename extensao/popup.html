<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="cabecalho">
    <div>
      <div class="titulo">Importador Hourglass</div>
      <div class="subtitulo">Sessão automática</div>
    </div>
    <span id="selo" class="selo">…</span>
  </header>

  <section class="lista" aria-live="polite">
    <div class="item"><span>Hourglass neste Chrome</span><strong id="estado-hourglass">…</strong></div>
    <div class="item"><span>Importador local</span><strong id="estado-importador">…</strong></div>
    <div class="item item--coluna"><span>Última sincronização</span><strong id="estado-ultima">…</strong></div>
  </section>

  <div class="acoes">
    <button id="botao-sincronizar" class="botao botao--primario">Sincronizar agora</button>
    <button id="botao-ativar" class="botao">…</button>
  </div>

  <p class="nota">Só age quando o importador (localhost:3434) pede a sessão ou quando você clica em Sincronizar. Desativada, não lê nenhum cookie.</p>
  <script src="popup.js"></script>
</body>
</html>
